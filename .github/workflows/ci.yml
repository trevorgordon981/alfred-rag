name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip && pip install fastapi httpx
      - name: Syntax check
        run: python -m compileall -q rag_server.py scripts/ingest.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
