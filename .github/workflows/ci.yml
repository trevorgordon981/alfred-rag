name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test and index dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx lancedb tantivy prometheus-client requests pydantic
      - name: Syntax check
        run: python -m compileall -q rag_common.py rag_server.py rag_eval.py scripts tests
      - name: Run unit and real-index regression tests
        run: python -m unittest discover -s tests -v
      - name: Run offline end-to-end demo
        run: python scripts/offline_demo.py
